{% load i18n %}{% if status.key == "critical" %}<span class="label label-danger" title="{{ status.reasons|join:', ' }}"><i class="fa fa-exclamation-circle" aria-hidden="true"></i> {% trans "Critical" %}</span>{% elif status.key == "warning" %}<span class="label label-warning" title="{{ status.reasons|join:', ' }}"><i class="fa fa-exclamation-triangle" aria-hidden="true"></i> {% trans "Warning" %}</span>{% elif status.key == "stale" %}<span class="label label-default" title="{% trans 'No recent data' %}"><i class="fa fa-clock-o" aria-hidden="true"></i> {% trans "Stale" %}</span>{% elif status.key == "unknown" %}<span class="label label-default" title="{% trans 'Reporting, but without a valid CPU value' %}"><i class="fa fa-question-circle" aria-hidden="true"></i> {% trans "Unknown" %}</span>{% else %}<span class="label label-success"><i class="fa fa-check-circle" aria-hidden="true"></i> {% trans "Healthy" %}</span>{% endif %}
